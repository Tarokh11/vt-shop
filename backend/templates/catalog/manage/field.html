{% if field.is_hidden %}{{ field }}{% else %}
<div class="field {% if field.field.widget.input_type == 'checkbox' %}checkbox-field{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}{{ field }}{{ field.label_tag }}{% else %}{{ field.label_tag }}{{ field }}{% endif %}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}{{ field.errors }}
</div>
{% endif %}
